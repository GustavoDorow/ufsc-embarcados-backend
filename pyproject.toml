[project]
name = "backend"
version = "0.1.0"
description = "Controle de acesso a quartos com Flask, SQLite e Swagger UI"
readme = "README.md"
authors = [
    { name = "Gustavo Sonntag Dorow", email = "gustavosdorow@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "flask>=3.1,<4",
    "flask-swagger-ui>=5,<6",
    "pyyaml>=6,<7",
    "requests>=2.32,<3",
]

[project.scripts]
backend = "backend.iniciar:iniciar_servicos"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
